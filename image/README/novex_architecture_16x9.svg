<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="NOVEX control architecture in 16:9 landscape format">
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64d9ff" stroke-width="1.6"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#eaf4ff}.main{font-size:26px;font-weight:700;letter-spacing:1px}.sub{font-size:19px;fill:#a5c1d5}.label{font-size:17px;fill:#7edcf9}.node{fill:#14253b;stroke:#4b9bb9;stroke-width:2.5}.line{fill:none;stroke:#64d9ff;stroke-width:3;marker-end:url(#arrow)}.plain{fill:none;stroke:#64d9ff;stroke-width:3}</style>
</defs>
<rect width="1600" height="900" rx="24" fill="#0b1524"/>
<text x="800" y="76" text-anchor="middle" font-size="38" font-weight="bold" letter-spacing="2">NOVEX • CONTROL ARCHITECTURE</text>
<text x="112" y="265" text-anchor="middle" class="main">HUMAN</text>
<path class="line" d="M176 255 H250"/><text x="214" y="223" text-anchor="middle" class="label">Voice / Gesture</text>
<rect class="node" x="254" y="202" width="216" height="106" rx="15"/><text x="362" y="244" text-anchor="middle" class="main">PHONE</text><text x="362" y="277" text-anchor="middle" class="sub">Controller</text>
<path class="line" d="M470 255 H530"/>
<rect class="node" x="534" y="202" width="216" height="106" rx="15"/><text x="642" y="244" text-anchor="middle" class="main">NOVA</text><text x="642" y="277" text-anchor="middle" class="sub">AI / LLM</text>
<path class="line" d="M750 255 H810"/><text x="780" y="223" text-anchor="middle" class="label">Mission Goal</text>
