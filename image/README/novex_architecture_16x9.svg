<path class="line" d="M1030 255 H1090"/><text x="1060" y="223" text-anchor="middle" class="label">Control State</text>
<rect class="node" x="1094" y="202" width="216" height="106" rx="15"/><text x="1202" y="244" text-anchor="middle" class="main">SAFETY</text><text x="1202" y="277" text-anchor="middle" class="main">LAYER</text>
<path class="line" d="M1310 255 H1370"/>
<rect class="node" x="1374" y="202" width="176" height="106" rx="15"/><text x="1462" y="264" text-anchor="middle" class="main">DRONE</text>
